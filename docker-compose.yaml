version: '2.4'
services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - app-volume:/data/db
    networks:
      app-network:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URL: "mongodb://mongo:27017/mydb"
    networks:
      app-network:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks:
      app-network:
networks:
  app-network:
volumes:
  app-volume:
